name: Release

on:
  push:
    tags:
      - 'v*'
      - 'uj.*'

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == uj.* ]]; then
            # uj.10 -> 0.4.0-UJ.10
            VERSION="0.4.0-UJ.${TAG#uj.}"
          else
            # v0.1.0 -> 0.1.0
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-win-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-win-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia qtshadertools qtserialport'
          cache: true

      - name: Setup vcpkg
        run: |
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: vcpkg install opus:x64-windows hidapi:x64-windows openssl:x64-windows

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DQK4_VERSION_FULL="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build

      - name: Create release package
        run: |
          mkdir QK4-windows
          copy build\QK4.exe QK4-windows\

          # Use windeployqt to bundle Qt DLLs
          windeployqt --release --no-translations QK4-windows\QK4.exe

          # Copy vcpkg DLLs (opus, hidapi, openssl)
          copy C:\vcpkg\installed\x64-windows\bin\opus.dll QK4-windows\
          copy C:\vcpkg\installed\x64-windows\bin\hidapi.dll QK4-windows\
          copy C:\vcpkg\installed\x64-windows\bin\libssl-3-x64.dll QK4-windows\
          copy C:\vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll QK4-windows\

          Compress-Archive -Path QK4-windows -DestinationPath QK4-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QK4-windows
          path: QK4-windows.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == uj.* ]]; then
            VERSION="0.4.0-UJ.${TAG#uj.}"
          else
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Cache Linux build dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/linux-apt-cache
            /tmp/linux-ccache
          key: linux-x86_64-${{ hashFiles('.github/scripts/build-linux.sh') }}
          restore-keys: linux-x86_64-

      - name: Build in Debian Trixie
        run: |
          mkdir -p /tmp/linux-apt-cache /tmp/linux-ccache
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /tmp/linux-apt-cache:/var/cache/apt/archives \
            -v /tmp/linux-ccache:/ccache \
            -e CCACHE_DIR=/ccache \
            -w /workspace \
            debian:trixie \
            bash /workspace/.github/scripts/build-linux.sh "${{ steps.version.outputs.version }}"
          sudo chown -R $(id -u):$(id -g) /tmp/linux-apt-cache /tmp/linux-ccache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QK4-linux
          path: QK4-linux-x86_64.tar.gz

  build-raspberry-pi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == uj.* ]]; then
            VERSION="0.4.0-UJ.${TAG#uj.}"
          else
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Cache Pi build dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/pi-apt-cache
            /tmp/pi-ccache
          key: pi-arm64-${{ hashFiles('.github/scripts/build-pi.sh') }}
          restore-keys: pi-arm64-

      - name: Cross-compile for ARM64 in Debian Trixie
        run: |
          mkdir -p /tmp/pi-apt-cache /tmp/pi-ccache
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /tmp/pi-apt-cache:/var/cache/apt/archives \
            -v /tmp/pi-ccache:/ccache \
            -e CCACHE_DIR=/ccache \
            -w /workspace \
            debian:trixie \
            bash /workspace/.github/scripts/build-pi.sh "${{ steps.version.outputs.version }}"
          sudo chown -R $(id -u):$(id -g) /tmp/pi-apt-cache /tmp/pi-ccache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QK4-raspberry-pi
          path: QK4-raspberry-pi-arm64.tar.gz

  release:
    needs: [build-windows, build-linux, build-raspberry-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          GC_URL=$(gh release view --repo orhun/git-cliff --json assets --jq '.assets[] | select(.name | test("x86_64-unknown-linux-gnu.tar.gz$")) | .url')
          curl -sSL "$GC_URL" | tar xz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-linux

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-raspberry-pi

      - name: Generate release notes
        run: git-cliff --latest --strip header -o release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QK4-windows.zip
            QK4-linux-x86_64.tar.gz
            QK4-raspberry-pi-arm64.tar.gz
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'uj.') }}

  publish:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-linux
          path: artifacts/linux

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@v4
        with:
          name: QK4-raspberry-pi
          path: artifacts/raspberry-pi

      - name: Update downloads and releases.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)

          # Remove old downloads, add new
          rm -rf downloads/
          mkdir -p "downloads/$TAG"
          cp artifacts/windows/QK4-windows.zip "downloads/$TAG/"
          cp artifacts/linux/QK4-linux-x86_64.tar.gz "downloads/$TAG/"
          cp artifacts/raspberry-pi/QK4-raspberry-pi-arm64.tar.gz "downloads/$TAG/"

          # Compute human-readable sizes
          SZ_WIN=$(du -h "downloads/$TAG/QK4-windows.zip" | cut -f1 | xargs)
          SZ_LIN=$(du -h "downloads/$TAG/QK4-linux-x86_64.tar.gz" | cut -f1 | xargs)
          SZ_PI=$(du -h "downloads/$TAG/QK4-raspberry-pi-arm64.tar.gz" | cut -f1 | xargs)

          # Compute SHA256 hashes
          HASH_WIN=$(sha256sum "downloads/$TAG/QK4-windows.zip" | cut -d' ' -f1)
          HASH_LIN=$(sha256sum "downloads/$TAG/QK4-linux-x86_64.tar.gz" | cut -d' ' -f1)
          HASH_PI=$(sha256sum "downloads/$TAG/QK4-raspberry-pi-arm64.tar.gz" | cut -d' ' -f1)

          # Detect prerelease
          if echo "$TAG" | grep -qE 'alpha|beta|^uj\.'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Build releases.json
          cat > releases.json <<EOF
          {
            "tag": "$TAG",
            "version": "$VERSION",
            "date": "$DATE",
            "prerelease": $PRERELEASE,
            "assets": {
              "windows": {
                "name": "QK4-windows.zip",
                "url": "./downloads/$TAG/QK4-windows.zip",
                "size": "$SZ_WIN",
                "sha256": "$HASH_WIN"
              },
              "linux": {
                "name": "QK4-linux-x86_64.tar.gz",
                "url": "./downloads/$TAG/QK4-linux-x86_64.tar.gz",
                "size": "$SZ_LIN",
                "sha256": "$HASH_LIN"
              },
              "raspberry-pi": {
                "name": "QK4-raspberry-pi-arm64.tar.gz",
                "url": "./downloads/$TAG/QK4-raspberry-pi-arm64.tar.gz",
                "size": "$SZ_PI",
                "sha256": "$HASH_PI"
              }
            }
          }
          EOF

          # Clean up artifacts directory
          rm -rf artifacts/

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ github.ref_name }}"
          git push
